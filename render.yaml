services:

  # ----------------------------------------------------------
  # Backend API
  # ----------------------------------------------------------
  - type: web
    name: mandya-groundwater-ai-api
    runtime: python
    plan: free
    rootDir: backend

    branch: main
    autoDeployTrigger: checksPass

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

  # ----------------------------------------------------------
  # Frontend
  # ----------------------------------------------------------
  - type: web
    name: mandya-groundwater-ai-web
    runtime: static
    rootDir: frontend

    branch: main
    autoDeployTrigger: checksPass

    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    routes:

      # API requests remain same-origin to the browser.
      # Render forwards them to the FastAPI service.
      - type: rewrite
        source: /api/*
        destination: https://mandya-groundwater-ai-api.onrender.com/api/*

      # React/Vite client-side routing fallback.
      - type: rewrite
        source: /*
        destination: /index.html
